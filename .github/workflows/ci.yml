name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q
      - name: Offline run on the shipped data
        run: navmon run --data data/sample --out outputs/ci
      - name: Committed sample memo is what the code produces
        if: matrix.python-version == '3.13'
        run: diff outputs/ci/memo.md outputs/sample/memo.md
